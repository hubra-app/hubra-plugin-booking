id: booking
name: Booking
version: "1.0.0"
hubra: ">=0.2,<1"
description: "Rooms and equipment on a calendar: members book a slot, the system refuses overlaps, the board approves where needed, and a fee goes on the member's invoice."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-booking
tags: [booking, rooms, equipment, calendar, makerspace]
package: hubra_booking
modules: [booking]
requires: [members, finance]
migrations: migrations
frontend: frontend/dist/plugin.js
# The areas this plugin extends; Hubra refuses a plugin that touches one it
# doesn't list. See docs/plugins.md in hubra-app/hubra.
uses: [routes, tables, nav, frontend]
